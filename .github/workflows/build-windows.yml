name: Build Windows Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          cd vst
          mkdir build-windows && cd build-windows
          cmake .. -G "Visual Studio 17 2022" -A x64
          if %ERRORLEVEL% neq 0 exit /b 1
          cmake --build . --config Release
          if %ERRORLEVEL% neq 0 exit /b 1

      - name: Find output
        if: always()
        run: |
          dir /s /b vst\build-windows\*.vst3
          dir /s /b vst\build-windows\Release\

      - name: Inno Setup
        if: success()
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\0MGE_setup.iss

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-vst3
          path: vst/build-windows/Release/0MGE.vst3

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-installer
          path: installers/windows/Output/*.exe

      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vst/build-windows/Release/0MGE.vst3
            installers/windows/Output/*.exe
          generate_release_notes: true
