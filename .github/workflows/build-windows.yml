name: Build Windows Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure + Build
        run: |
          # Find Visual Studio installation
          $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host "VS: $vsPath"

          # Load MSVC environment
          $vcvarsall = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
          cmd /c "`"$vcvarsall`" x64 && set" | ForEach-Object {
            if ($_ -match "^(.+?)=(.*)$") {
              [System.Environment]::SetEnvironmentVariable($matches[1], $matches[2])
            }
          }

          # Install Ninja
          choco install ninja -y --no-progress

          # Build
          cd vst
          New-Item -ItemType Directory -Force -Path build-windows | Out-Null
          cd build-windows
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl 2>&1
          cmake --build . 2>&1

      - name: Show output
        if: always()
        run: |
          Get-ChildItem -Recurse vst/build-windows -Include "*.vst3","*.exe","*.dll" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }

      - name: Create installer
        if: success()
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\0MGE_setup.iss 2>&1

      - name: Upload plugin
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-vst3
          path: vst/build-windows/0MGE.vst3

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-installer
          path: installers/windows/Output/*.exe

      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vst/build-windows/0MGE.vst3
            installers/windows/Output/*.exe
          generate_release_notes: true
