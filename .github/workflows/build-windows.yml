name: Build Windows Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show environment
        shell: pwsh
        run: |
          cmake --version
          where.exe cl.exe 2>$null
          Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "cl.exe" -ErrorAction SilentlyContinue | Select-Object -First 1 FullName

      - name: Configure CMake
        shell: pwsh
        working-directory: vst
        run: |
          New-Item -ItemType Directory -Force -Path build-windows
          cd build-windows
          cmake .. -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        working-directory: vst/build-windows
        run: |
          cmake --build . --config Release 2>&1

      - name: List output
        shell: pwsh
        run: |
          Get-ChildItem -Recurse vst/build-windows -Filter "*.vst3" -ErrorAction SilentlyContinue
          Get-ChildItem -Recurse vst/build-windows/Release -ErrorAction SilentlyContinue

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\0MGE_setup.iss

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-vst3
          path: vst/build-windows/Release/0MGE.vst3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-installer
          path: installers/windows/Output/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vst/build-windows/Release/0MGE.vst3
            installers/windows/Output/*.exe
          generate_release_notes: true
