name: Build Windows Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build plugin
        shell: cmd
        run: |
          cd vst
          mkdir build-windows
          cd build-windows
          cmake .. -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Create Inno Setup installer
        shell: cmd
        run: |
          choco install innosetup -y --no-progress
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installers\windows\0MGE_setup.iss

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-vst3
          path: vst/build-windows/Release/0MGE.vst3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-windows-installer
          path: installers/windows/Output/*.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            vst/build-windows/Release/0MGE.vst3
            installers/windows/Output/*.exe
          generate_release_notes: true
