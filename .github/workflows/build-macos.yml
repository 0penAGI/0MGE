name: Build macOS Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build plugin
        run: |
          cd vst
          mkdir -p build-macos
          cd build-macos
          cmake .. -G Xcode -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release

      - name: Create .pkg installer
        run: |
          sed -i '' 's|vst/build/ZeroMGE_Project_artefacts/Release|vst/build-macos/Release|' installers/macos/build_pkg.sh
          bash installers/macos/build_pkg.sh

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-macos-vst3
          path: vst/build-macos/Release/VST3/0MGE.vst3

      - name: Upload AU
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-macos-au
          path: vst/build-macos/Release/AU/0MGE.component

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-macos-installer
          path: release/macos/*.pkg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/*.pkg
            vst/build-macos/Release/VST3/0MGE.vst3
            vst/build-macos/Release/AU/0MGE.component
          generate_release_notes: true
