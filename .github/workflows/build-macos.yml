name: Build macOS Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          cd vst
          cmake -B build-macos -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build-macos

      - name: Find outputs
        if: always()
        run: find vst/build-macos -name "*.vst3" -o -name "*.component" -o -name "0MGE" -type f 2>/dev/null

      - name: Package
        if: success()
        run: |
          sed -i '' 's|vst/build/ZeroMGE_Project_artefacts/Release|vst/build-macos|' installers/macos/build_pkg.sh
          bash installers/macos/build_pkg.sh

      - name: Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-macos
          path: |
            vst/build-macos/VST3/0MGE.vst3
            vst/build-macos/AU/0MGE.component
            release/macos/*.pkg

      - name: Release
        if: success() && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/*.pkg
            vst/build-macos/VST3/0MGE.vst3
            vst/build-macos/AU/0MGE.component
          generate_release_notes: true
