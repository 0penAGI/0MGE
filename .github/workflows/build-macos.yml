name: Build macOS Plugin

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin
        run: |
          cd vst
          mkdir build-macos
          cd build-macos
          cmake .. -G Xcode
          cmake --build . --config Release

      - name: Create .pkg installer
        run: |
          # Update build_pkg.sh to use CI build path
          sed -i '' 's|ZeroMGE_Project_artefacts/Release|Release|' installers/macos/build_pkg.sh
          bash installers/macos/build_pkg.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 0MGE-macos
          path: |
            vst/build-macos/Release/VST3/0MGE.vst3
            vst/build-macos/Release/AU/0MGE.component
            release/macos/*.pkg

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/macos/*.pkg
            vst/build-macos/Release/VST3/0MGE.vst3
            vst/build-macos/Release/AU/0MGE.component
          generate_release_notes: true
